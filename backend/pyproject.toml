[project]
name = "ap-agent"
version = "0.1.0"
description = "Accounts Payable Agent powered by Sarvam Vision + Sarvam-105B"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9",
    "reportlab>=4.2",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
